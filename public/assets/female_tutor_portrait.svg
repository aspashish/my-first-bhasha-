<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#EADCC9" />
    </linearGradient>

    <!-- Aura Halo for Speaking -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#800020" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#800020" stop-opacity="0" />
    </radialGradient>

    <!-- Maroon Outfit Gradient -->
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#721422" />
      <stop offset="50%" stop-color="#560D17" />
      <stop offset="100%" stop-color="#3D060E" />
    </linearGradient>

    <!-- Gold Embroidery Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- Skin Tone Gradients -->
    <linearGradient id="skinBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C5A5" />
      <stop offset="60%" stop-color="#E8B08A" />
      <stop offset="100%" stop-color="#D99B73" />
    </linearGradient>

    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D99B73" />
      <stop offset="100%" stop-color="#BF7F54" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D1F1A" />
      <stop offset="40%" stop-color="#1B120E" />
      <stop offset="100%" stop-color="#0E0806" />
    </linearGradient>

    <!-- Lip Gradient -->
    <linearGradient id="lipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D85C66" />
      <stop offset="100%" stop-color="#B83240" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="24" />
  <circle cx="200" cy="200" r="175" fill="url(#auraGlow)" />

  <!-- Background Hair Volume -->
  <ellipse cx="200" cy="180" rx="90" ry="110" fill="url(#hairGrad)" />
  <circle cx="200" cy="95" r="55" fill="url(#hairGrad)" />

  <!-- Maroon Embroidered Outfit & Shoulders -->
  <path d="M 90 400 L 90 340 C 95 305 130 280 160 275 L 180 305 L 220 305 L 240 275 C 270 280 305 305 310 340 L 310 400 Z" fill="url(#maroonGrad)" />

  <!-- Gold Embroidery Pattern on Kurta Neckline -->
  <path d="M 160 275 Q 200 325 240 275 Q 200 345 160 275" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 170 285 Q 200 328 230 285" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Intricate Paisley / Floral Gold Motifs -->
  <circle cx="200" cy="318" r="4" fill="url(#goldGrad)" />
  <circle cx="185" cy="308" r="3" fill="url(#goldGrad)" />
  <circle cx="215" cy="308" r="3" fill="url(#goldGrad)" />
  <circle cx="175" cy="296" r="2.5" fill="url(#goldGrad)" />
  <circle cx="225" cy="296" r="2.5" fill="url(#goldGrad)" />
  <circle cx="165" cy="285" r="2" fill="url(#goldGrad)" />
  <circle cx="235" cy="285" r="2" fill="url(#goldGrad)" />

  <!-- Delicate Dupatta / Stole Drapes -->
  <path d="M 100 340 Q 140 330 170 360 L 160 400 L 90 400 Z" fill="#5F0E1A" opacity="0.85" />
  <path d="M 300 340 Q 260 330 230 360 L 240 400 L 310 400 Z" fill="#5F0E1A" opacity="0.85" />
  <line x1="100" y1="345" x2="165" y2="400" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7" />

  <!-- Neck -->
  <path d="M 175 230 L 175 285 Q 200 295 225 285 L 225 230 Z" fill="url(#skinShadow)" />
  <path d="M 178 230 L 178 280 Q 200 290 222 280 L 222 230 Z" fill="url(#skinBase)" />

  <!-- Subtle Gold Pendant / Mangalsutra / Chain -->
  <path d="M 183 260 Q 200 274 217 260" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
  <circle cx="200" cy="272" r="2.8" fill="url(#goldGrad)" />

  <!-- Head Base / Face Structure -->
  <path d="M 142 165 C 140 215 160 255 200 255 C 240 255 260 215 258 165 C 256 125 235 110 200 110 C 165 110 144 125 142 165 Z" fill="url(#skinBase)" />

  <!-- Soft Cheek Blush -->
  <ellipse cx="163" cy="195" rx="14" ry="8" fill="#D9534F" opacity="0.18" />
  <ellipse cx="237" cy="195" rx="14" ry="8" fill="#D9534F" opacity="0.18" />

  <!-- Ears & Gold Earrings (Jhumkas) -->
  <!-- Left Ear -->
  <ellipse cx="141" cy="178" rx="8" ry="14" fill="url(#skinBase)" />
  <circle cx="140" cy="187" r="3.5" fill="url(#goldGrad)" />
  <path d="M 136 191 Q 140 197 144 191 Z" fill="url(#goldGrad)" />
  <circle cx="140" cy="200" r="1.5" fill="url(#goldGrad)" />

  <!-- Right Ear -->
  <ellipse cx="259" cy="178" rx="8" ry="14" fill="url(#skinBase)" />
  <circle cx="260" cy="187" r="3.5" fill="url(#goldGrad)" />
  <path d="M 256 191 Q 260 197 264 191 Z" fill="url(#goldGrad)" />
  <circle cx="260" cy="200" r="1.5" fill="url(#goldGrad)" />

  <!-- Forehead Hairline and Styled Front Hair Waves -->
  <path d="M 141 155 C 145 118 165 95 200 95 C 235 95 255 118 259 155 C 250 135 230 120 200 125 C 170 120 150 135 141 155 Z" fill="url(#hairGrad)" />
  <!-- Side sweeps -->
  <path d="M 140 150 C 142 180 146 205 152 215 C 148 200 144 175 142 150 Z" fill="url(#hairGrad)" />
  <path d="M 260 150 C 258 180 254 205 248 215 C 252 200 256 175 258 150 Z" fill="url(#hairGrad)" />

  <!-- Hair Sheen Highlight -->
  <path d="M 170 108 Q 200 102 230 108" fill="none" stroke="#523930" stroke-width="3" opacity="0.6" stroke-linecap="round" />

  <!-- Small Bindi -->
  <circle cx="200" cy="152" r="2.5" fill="#800020" />

  <!-- Eyebrows -->
  <path d="M 158 162 Q 173 157 186 163" fill="none" stroke="#231713" stroke-width="2.8" stroke-linecap="round" />
  <path d="M 214 163 Q 227 157 242 162" fill="none" stroke="#231713" stroke-width="2.8" stroke-linecap="round" />

  <!-- Warm, Intelligent Eyes -->
  <!-- Left Eye -->
  <ellipse cx="172" cy="173" rx="10.5" ry="6.2" fill="#FFFFFF" />
  <circle cx="173" cy="173" r="5" fill="#3D2314" />
  <circle cx="173" cy="173" r="2.5" fill="#150D07" />
  <circle cx="174.5" cy="171.5" r="1.3" fill="#FFFFFF" />
  <path d="M 161 172 Q 172 166 183 172" fill="none" stroke="#2A1B14" stroke-width="2" stroke-linecap="round" />

  <!-- Right Eye -->
  <ellipse cx="228" cy="173" rx="10.5" ry="6.2" fill="#FFFFFF" />
  <circle cx="227" cy="173" r="5" fill="#3D2314" />
  <circle cx="227" cy="173" r="2.5" fill="#150D07" />
  <circle cx="228.5" cy="171.5" r="1.3" fill="#FFFFFF" />
  <path d="M 217 172 Q 228 166 239 172" fill="none" stroke="#2A1B14" stroke-width="2" stroke-linecap="round" />

  <!-- Eyelashes -->
  <path d="M 181 169 L 183 167" stroke="#2A1B14" stroke-width="1.2" stroke-linecap="round" />
  <path d="M 219 169 L 217 167" stroke="#2A1B14" stroke-width="1.2" stroke-linecap="round" />

  <!-- Nose -->
  <path d="M 197 170 Q 199 193 194 198 Q 200 202 206 198" fill="none" stroke="#BD8259" stroke-width="1.8" stroke-linecap="round" />

  <!-- Friendly Smile / Lips (Neutral state) -->
  <g id="avatar-mouth">
    <path d="M 183 222 Q 200 220 217 222 Q 200 236 183 222 Z" fill="url(#lipGrad)" />
    <!-- Center smile curve -->
    <path d="M 184 222 Q 200 227 216 222" fill="none" stroke="#68151D" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Chin line -->
  <path d="M 193 243 Q 200 246 207 243" fill="none" stroke="#D18F64" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
</svg>
