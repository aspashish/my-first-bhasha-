  <path d="M 300 660 Q 360 760 420 660 Q 360 810 300 660" fill="none" stroke="url(#goldLuster)" stroke-width="8" stroke-linecap="round" />
  <path d="M 315 675 Q 360 770 405 675" fill="none" stroke="url(#goldLuster)" stroke-width="3.5" stroke-dasharray="6,4" />
  
  <!-- Neckline Paisley & Floret Embellishments -->
  <circle cx="360" cy="745" r="7" fill="url(#goldLuster)" />
  <circle cx="335" cy="728" r="5" fill="url(#goldLuster)" />
  <circle cx="385" cy="728" r="5" fill="url(#goldLuster)" />
  <circle cx="320" cy="705" r="4.5" fill="url(#goldLuster)" />
  <circle cx="400" cy="705" r="4.5" fill="url(#goldLuster)" />
  <circle cx="308" cy="680" r="4" fill="url(#goldLuster)" />
  <circle cx="412" cy="680" r="4" fill="url(#goldLuster)" />

  <!-- Sleeve & Chest Embroidery Motifs -->
  <!-- Left Side floral vines -->
  <path d="M 270 760 Q 285 790 275 830" fill="none" stroke="url(#goldLuster)" stroke-width="2.5" />
  <circle cx="280" cy="785" r="3.5" fill="url(#goldLuster)" />
  <circle cx="272" cy="820" r="3.5" fill="url(#goldLuster)" />
  <!-- Right Side floral vines -->
  <path d="M 450 760 Q 435 790 445 830" fill="none" stroke="url(#goldLuster)" stroke-width="2.5" />
  <circle cx="440" cy="785" r="3.5" fill="url(#goldLuster)" />
  <circle cx="448" cy="820" r="3.5" fill="url(#goldLuster)" />
  <!-- Center chest floral buta -->
  <ellipse cx="360" cy="795" rx="16" ry="10" fill="none" stroke="url(#goldLuster)" stroke-width="2.5" />
  <circle cx="360" cy="795" r="4" fill="url(#goldLuster)" />

  <!-- Delicate Sheer Sleeves with gold cuffs -->
  <path d="M 140 1020 C 130 920 160 840 210 790 L 260 830 C 220 900 200 970 190 1020 Z" fill="#660D1A" opacity="0.88" />
  <path d="M 580 1020 C 590 920 560 840 510 790 L 460 830 C 500 900 520 970 530 1020 Z" fill="#660D1A" opacity="0.88" />

