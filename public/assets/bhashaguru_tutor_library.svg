<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <!-- Background Library Atmosphere Gradients -->
    <linearGradient id="wallWoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E100A" />
      <stop offset="40%" stop-color="#2D180F" />
      <stop offset="80%" stop-color="#22120B" />
      <stop offset="100%" stop-color="#140905" />
    </linearGradient>

    <!-- Warm Lamp Amber Glow -->
    <radialGradient id="lampGlowLeft" cx="15%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#FFD685" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#F5A623" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#E07A10" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1E100A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="lampGlowRight" cx="88%" cy="38%" r="30%">
      <stop offset="0%" stop-color="#FFE094" stop-opacity="0.75" />
      <stop offset="35%" stop-color="#E59828" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#C26A0E" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1E100A" stop-opacity="0" />
    </radialGradient>

    <!-- Desk Wood Gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#542813" />
      <stop offset="20%" stop-color="#3D1A0A" />
      <stop offset="60%" stop-color="#291106" />
      <stop offset="100%" stop-color="#160803" />
    </linearGradient>

    <!-- Bookshelf Wood Gradient -->
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A1D11" />
      <stop offset="50%" stop-color="#2B140B" />
      <stop offset="100%" stop-color="#1E0D06" />
    </linearGradient>

    <!-- Gold Ornament Gradient -->
    <linearGradient id="goldLuster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A5" />
      <stop offset="35%" stop-color="#F2C94C" />
      <stop offset="70%" stop-color="#D49A24" />
      <stop offset="100%" stop-color="#8E5E0C" />
    </linearGradient>

    <!-- Brass Antique Gradient -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBD59B" />
      <stop offset="50%" stop-color="#BFA054" />
      <stop offset="100%" stop-color="#7A5E25" />
    </linearGradient>

    <!-- Maroon Dress Gradient -->
    <linearGradient id="maroonKurtiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#801424" />
      <stop offset="35%" stop-color="#6B0F1C" />
      <stop offset="70%" stop-color="#540B15" />
      <stop offset="100%" stop-color="#38050C" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairRichGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C1B14" />
      <stop offset="40%" stop-color="#1A0F0A" />
      <stop offset="80%" stop-color="#100805" />
      <stop offset="100%" stop-color="#080302" />
    </linearGradient>

    <!-- Skin Tone Base -->
    <linearGradient id="skinRadiant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8CCA8" />
      <stop offset="40%" stop-color="#EDB389" />
      <stop offset="85%" stop-color="#DD996D" />
      <stop offset="100%" stop-color="#C57E52" />
    </linearGradient>

    <linearGradient id="skinContour" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D99166" />
      <stop offset="100%" stop-color="#B76E43" />
    </linearGradient>

    <!-- Lips Gradient -->
    <linearGradient id="lipLuster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DF6473" />
      <stop offset="60%" stop-color="#C23E51" />
      <stop offset="100%" stop-color="#8F1F2F" />
    </linearGradient>

    <!-- Speaking Aura Glow -->
    <radialGradient id="tutorAura" cx="50%" cy="45%" r="45%">
      <stop offset="30%" stop-color="#FFD685" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#9C27B0" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- ================= BACKGROUND ROOM ================= -->
