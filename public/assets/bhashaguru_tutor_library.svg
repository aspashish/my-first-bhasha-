  <!-- Ambient light glows from lamps -->
  <circle cx="108" cy="448" r="420" fill="url(#lampGlowLeft)" />
  <circle cx="633" cy="486" r="380" fill="url(#lampGlowRight)" />

  <!-- Center bookshelf backing behind tutor -->
  <rect x="230" y="0" width="350" height="740" fill="#180C07" />
  
  <!-- Bookshelf uprights and horizontal shelves -->
  <rect x="230" y="140" width="350" height="16" fill="url(#shelfGrad)" />
  <rect x="230" y="290" width="350" height="16" fill="url(#shelfGrad)" />
  <rect x="230" y="440" width="350" height="16" fill="url(#shelfGrad)" />
  <rect x="570" y="0" width="22" height="740" fill="url(#shelfGrad)" />

  <!-- Books on upper shelves -->
  <!-- Shelf 1 Books -->
  <rect x="245" y="40" width="26" height="100" fill="#6B2D1B" rx="2" />
  <rect x="273" y="48" width="24" height="92" fill="#1C3D32" rx="2" />
  <rect x="299" y="35" width="30" height="105" fill="#4A1E2B" rx="2" />
  <rect x="331" y="45" width="22" height="95" fill="#75501B" rx="2" />
  <rect x="355" y="38" width="28" height="102" fill="#1F2A44" rx="2" />
  <rect x="385" y="52" width="24" height="88" fill="#5E2218" rx="2" />
  <rect x="411" y="42" width="26" height="98" fill="#2D4436" rx="2" />
  <rect x="439" y="36" width="32" height="104" fill="#63311A" rx="2" />
  <rect x="473" y="46" width="24" height="94" fill="#3A1C47" rx="2" />
  <rect x="499" y="40" width="28" height="100" fill="#1B3838" rx="2" />
  <rect x="529" y="50" width="30" height="90" fill="#7A3B18" rx="2" />

  <!-- Shelf 2 Books -->
  <rect x="245" y="180" width="28" height="110" fill="#192A40" rx="2" />
  <rect x="275" y="195" width="22" height="95" fill="#4A1818" rx="2" />
  <rect x="299" y="175" width="32" height="115" fill="#6E4416" rx="2" />
  <rect x="333" y="185" width="26" height="105" fill="#1C3829" rx="2" />
  <rect x="470" y="182" width="28" height="108" fill="#58212C" rx="2" />
  <rect x="500" y="192" width="24" height="98" fill="#6A4E1B" rx="2" />
  <rect x="526" y="178" width="32" height="112" fill="#1A2D3B" rx="2" />

  <!-- Gold foil lines on book spines -->
  <line x1="248" y1="65" x2="268" y2="65" stroke="url(#goldLuster)" stroke-width="2" />
  <line x1="302" y1="60" x2="326" y2="60" stroke="url(#goldLuster)" stroke-width="2" />
  <line x1="358" y1="62" x2="380" y2="62" stroke="url(#goldLuster)" stroke-width="2" />
  <line x1="442" y1="58" x2="468" y2="58" stroke="url(#goldLuster)" stroke-width="2" />

  <!-- Left Wall Lamp Sconce & Table Lamp -->
  <!-- Classical table lamp left -->
  <ellipse cx="85" cy="620" rx="42" ry="12" fill="url(#brassGrad)" />
  <path d="M 75 620 L 80 500 L 90 500 L 95 620 Z" fill="url(#brassGrad)" />
  <ellipse cx="85" cy="500" rx="14" ry="5" fill="url(#goldLuster)" />
  <!-- Glass Lamp Shade -->
  <path d="M 40 470 L 60 380 L 110 380 L 130 470 Z" fill="#FFEBB5" opacity="0.9" />
  <ellipse cx="85" cy="470" rx="45" ry="12" fill="#FFC966" opacity="0.8" />
  <ellipse cx="85" cy="380" rx="25" ry="7" fill="#FFF3D1" />
  <!-- Wall sconce lamp right -->
  <rect x="670" y="340" width="16" height="60" fill="url(#brassGrad)" rx="3" />
  <ellipse cx="678" cy="330" rx="18" ry="24" fill="#FFDA85" opacity="0.85" />

  <!-- Deep Velvet Drapery / Curtains on far left -->
  <path d="M 0 0 C 40 100 20 300 35 600 L 0 600 Z" fill="#0C2029" opacity="0.8" />

  <!-- Aura behind tutor -->
  <circle cx="360" cy="560" r="320" fill="url(#tutorAura)" />

  <!-- ================= THE AI TUTOR ================= -->
  <!-- Hair Back Volume -->
  <ellipse cx="360" cy="460" rx="160" ry="210" fill="url(#hairRichGrad)" />
  <path d="M 200 450 C 180 580 190 750 250 830 L 470 830 C 530 750 540 580 520 450 Z" fill="url(#hairRichGrad)" />

  <!-- Maroon Kurti Outfit & Shoulders -->
