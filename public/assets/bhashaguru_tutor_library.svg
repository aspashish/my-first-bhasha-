  <path d="M 190 1020 Q 250 1000 320 1005 L 360 1040 Q 260 1070 180 1030 Z" fill="url(#skinRadiant)" />
  <!-- Right Arm with Traditional Gold Bangles -->
  <path d="M 530 1020 Q 470 1000 400 1005 L 360 1040 Q 460 1070 540 1030 Z" fill="url(#skinRadiant)" />
  
  <!-- Intricate Gold Bangles Stack on Wrist -->
  <rect x="470" y="975" width="40" height="32" rx="6" fill="url(#goldLuster)" stroke="#7A520A" stroke-width="1.5" />
  <line x1="475" y1="983" x2="505" y2="983" stroke="#684205" stroke-width="1.5" />
  <line x1="475" y1="991" x2="505" y2="991" stroke="#684205" stroke-width="1.5" />
  <line x1="475" y1="999" x2="505" y2="999" stroke="#684205" stroke-width="1.5" />

  <!-- Graceful Clasped Hands on Wooden Desk -->
  <!-- Left Hand fingers -->
  <path d="M 330 1000 C 350 990 380 1005 385 1020 C 375 1035 345 1030 330 1015 Z" fill="url(#skinRadiant)" />
  <!-- Right Hand resting over left -->
  <path d="M 350 995 C 380 985 410 1005 405 1025 C 390 1040 360 1030 345 1010 Z" fill="url(#skinRadiant)" />

  <!-- Neck & Shadow -->
  <path d="M 315 580 L 315 675 Q 360 695 405 675 L 405 580 Z" fill="url(#skinContour)" />
  <path d="M 322 580 L 322 665 Q 360 685 398 665 L 398 580 Z" fill="url(#skinRadiant)" />

  <!-- Delicate Gold Pendant / Necklace -->
  <path d="M 330 625 Q 360 655 390 625" fill="none" stroke="url(#goldLuster)" stroke-width="3" />
  <circle cx="360" cy="652" r="5" fill="url(#goldLuster)" />
  <path d="M 355 656 L 360 666 L 365 656 Z" fill="url(#goldLuster)" />

  <!-- Face Contour & Jawline -->
  <path d="M 265 460 C 260 550 300 625 360 625 C 420 625 460 550 455 460 C 450 385 415 360 360 360 C 305 360 270 385 265 460 Z" fill="url(#skinRadiant)" />

  <!-- Soft Radiant Cheek Blush -->
  <ellipse cx="295" cy="515" rx="26" ry="16" fill="#D9534F" opacity="0.16" />
  <ellipse cx="425" cy="515" rx="26" ry="16" fill="#D9534F" opacity="0.16" />

  <!-- Ears & Traditional Gold Jhumka Earrings -->
  <!-- Left Ear & Jhumka -->
  <ellipse cx="262" cy="485" rx="14" ry="24" fill="url(#skinRadiant)" />
  <circle cx="258" cy="502" r="6" fill="url(#goldLuster)" />
  <path d="M 252 510 Q 258 522 264 510 Z" fill="url(#goldLuster)" stroke="#8C600B" stroke-width="1" />
  <circle cx="258" cy="526" r="3" fill="url(#goldLuster)" />
  <!-- Hanging pearls/beads on jhumka -->
  <circle cx="253" cy="521" r="2" fill="#FFF8E7" />
  <circle cx="263" cy="521" r="2" fill="#FFF8E7" />

  <!-- Right Ear & Jhumka -->
  <ellipse cx="458" cy="485" rx="14" ry="24" fill="url(#skinRadiant)" />
  <circle cx="462" cy="502" r="6" fill="url(#goldLuster)" />
  <path d="M 456 510 Q 462 522 468 510 Z" fill="url(#goldLuster)" stroke="#8C600B" stroke-width="1" />
  <circle cx="462" cy="526" r="3" fill="url(#goldLuster)" />
  <circle cx="457" cy="521" r="2" fill="#FFF8E7" />
  <circle cx="467" cy="521" r="2" fill="#FFF8E7" />

  <!-- Styled Front Hair, Center Parting & Flowing Strands -->
  <path d="M 264 450 C 270 380 305 340 360 340 C 415 340 450 380 456 450 C 440 410 405 385 360 395 C 315 385 280 410 264 450 Z" fill="url(#hairRichGrad)" />
  <!-- Side sweeps framing cheeks -->
  <path d="M 264 440 C 268 500 275 550 286 570 C 278 540 270 490 266 440 Z" fill="url(#hairRichGrad)" />
  <path d="M 456 440 C 452 500 445 550 434 570 C 442 540 450 490 454 440 Z" fill="url(#hairRichGrad)" />
  <!-- Hair highlights with soft sheen -->
  <path d="M 310 365 Q 360 350 410 365" fill="none" stroke="#5A3A2C" stroke-width="4.5" opacity="0.65" stroke-linecap="round" />

  <!-- Elegant Bindi -->
  <circle cx="360" cy="445" r="4.2" fill="#800020" />

  <!-- Arched, Expressive Eyebrows -->
  <path d="M 292 462 Q 318 452 342 464" fill="none" stroke="#24140D" stroke-width="4" stroke-linecap="round" />
  <path d="M 378 464 Q 402 452 428 462" fill="none" stroke="#24140D" stroke-width="4" stroke-linecap="round" />

  <!-- Warm, Luminous, Encouraging Eyes -->
  <!-- Left Eye -->
  <ellipse cx="317" cy="482" rx="18" ry="11" fill="#FFFFFF" />
  <circle cx="318" cy="482" r="9.5" fill="#3D2012" />
  <circle cx="318" cy="482" r="5" fill="#140904" />
  <circle cx="321" cy="479" r="2.8" fill="#FFFFFF" />
  <circle cx="315" cy="485" r="1.2" fill="#FFFFFF" opacity="0.7" />
  <!-- Eyeliner & Lashes Left -->
  <path d="M 298 480 Q 317 470 336 480" fill="none" stroke="#1A0D07" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 334 476 L 338 472" stroke="#1A0D07" stroke-width="2" stroke-linecap="round" />

  <!-- Right Eye -->
  <ellipse cx="403" cy="482" rx="18" ry="11" fill="#FFFFFF" />
  <circle cx="402" cy="482" r="9.5" fill="#3D2012" />
  <circle cx="402" cy="482" r="5" fill="#140904" />
  <circle cx="405" cy="479" r="2.8" fill="#FFFFFF" />
  <circle cx="399" cy="485" r="1.2" fill="#FFFFFF" opacity="0.7" />
  <!-- Eyeliner & Lashes Right -->
  <path d="M 384 480 Q 403 470 422 480" fill="none" stroke="#1A0D07" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 420 476 L 424 472" stroke="#1A0D07" stroke-width="2" stroke-linecap="round" />

  <!-- Defined Nose -->
  <path d="M 355 475 Q 358 520 348 528 Q 360 535 372 528 Q 364 520 365 475" fill="none" stroke="#BD7E54" stroke-width="2.8" stroke-linecap="round" />

  <!-- Warm, Intelligent Smile / Lips -->
  <g id="tutor-mouth">
    <path d="M 332 568 Q 360 564 388 568 Q 360 594 332 568 Z" fill="url(#lipLuster)" />
    <!-- Natural Cupid's bow and smile line -->
    <path d="M 334 568 Q 360 574 386 568" fill="none" stroke="#751522" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Soft Chin Definition -->
  <path d="M 348 604 Q 360 610 372 604" fill="none" stroke="#D18F64" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- ================= DESK & CLASSICAL ACCESSORIES ================= -->
  <!-- Classical Wooden Desk Surface -->
  <path d="M 0 1020 L 720 1020 L 720 1280 L 0 1280 Z" fill="url(#deskGrad)" />
  <line x1="0" y1="1020" x2="720" y2="1020" stroke="#783918" stroke-width="5" />
  <!-- Wood grain sheen on desk -->
  <line x1="20" y1="1035" x2="700" y2="1035" stroke="#3A170A" stroke-width="1.5" opacity="0.6" />
  <line x1="50" y1="1070" x2="670" y2="1070" stroke="#3A170A" stroke-width="1.5" opacity="0.4" />

  <!-- Left: Antique Brass Paperweight / Stamp -->
  <path d="M 70 1080 L 90 1080 L 95 1130 L 65 1130 Z" fill="url(#brassGrad)" />
  <circle cx="80" cy="1070" r="16" fill="url(#goldLuster)" />
  <ellipse cx="80" cy="1130" rx="32" ry="12" fill="url(#brassGrad)" />

  <!-- Center Left: Vintage Wooden Magnifying Glass -->
  <path d="M 140 1140 L 230 1120" stroke="#5A2E14" stroke-width="12" stroke-linecap="round" />
  <circle cx="265" cy="1115" r="34" fill="none" stroke="url(#brassGrad)" stroke-width="6" />
  <circle cx="265" cy="1115" r="30" fill="#E8F4F8" opacity="0.25" />
  <path d="M 250 1100 Q 265 1095 280 1105" stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" />

  <!-- Right: Glass Inkwell & Feather Quill Pen -->
  <!-- Glass Ink Bottle -->
  <rect x="500" y="1080" width="60" height="55" rx="8" fill="#2E3842" opacity="0.85" />
  <rect x="510" y="1090" width="40" height="38" rx="4" fill="#0C1014" />
  <rect x="515" y="1070" width="30" height="12" rx="3" fill="url(#brassGrad)" />
  <!-- Ink bottle glass highlights -->
  <line x1="505" y1="1085" x2="505" y2="1125" stroke="#A6C8E0" stroke-width="2.5" opacity="0.5" />
  <!-- Feather Quill Pen -->
  <path d="M 528 1075 Q 560 970 630 890 Q 640 920 600 980 Q 565 1030 535 1070 Z" fill="#D6C6B2" />
  <path d="M 530 1075 Q 570 960 630 890" fill="none" stroke="#5C4738" stroke-width="2" />
  <!-- Delicate feather barbs -->
  <path d="M 570 960 L 590 940 M 580 940 L 605 920 M 595 920 L 620 900" stroke="#FAF4EB" stroke-width="1.5" />

  <!-- Far Right: Antique Wooden Desk Clock -->
  <rect x="630" y="1040" width="70" height="95" rx="8" fill="#3D1809" stroke="url(#goldLuster)" stroke-width="3" />
  <ellipse cx="665" cy="1085" rx="25" ry="25" fill="#FFFDF5" stroke="url(#brassGrad)" stroke-width="3" />
  <!-- Clock hands -->
  <line x1="665" y1="1085" x2="665" y2="1068" stroke="#1A0F07" stroke-width="2.5" stroke-linecap="round" />
  <line x1="665" y1="1085" x2="678" y2="1080" stroke="#1A0F07" stroke-width="2" stroke-linecap="round" />
  <circle cx="665" cy="1085" r="2.5" fill="url(#goldLuster)" />
</svg>
